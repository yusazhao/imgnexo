<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img">
	<title>fix blurry photo before after sample</title>
	<rect width="960" height="540" fill="#efe6d4"/>
	<g>
		<rect x="50" y="70" width="400" height="360" rx="18" fill="#d9e4ea"/>
		<g filter="url(#soft)">
			<circle cx="250" cy="220" r="70" fill="#f2d7bd"/>
			<rect x="190" y="290" width="120" height="90" rx="12" fill="#3d6d8a"/>
		</g>
		<text x="70" y="50" fill="#1c1915" font-family="Georgia, serif" font-size="28">Before</text>
	</g>
	<g>
		<rect x="510" y="70" width="400" height="360" rx="18" fill="#d9e4ea"/>
		<circle cx="710" cy="220" r="70" fill="#f2d7bd"/>
		<rect x="650" y="290" width="120" height="90" rx="12" fill="#3d6d8a"/>
		<text x="530" y="50" fill="#1c1915" font-family="Georgia, serif" font-size="28">After clarity</text>
	</g>
	<defs>
		<filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
	</defs>
</svg>
